<div class="article-grid mb-5">
    {% for post in worldcup_posts %}
    <a href="{{ post.get_absolute_url }}" class="article-card">
        {% if post.featured_image %}
            <img src="{{ post.featured_image.url }}" alt="{{ post.title }}">
        {% endif %}
        <h3>{{ post.title }}</h3>
        <p>{{ post.content|truncatewords:15 }}</p>
    </a>
    {% endfor %}
</div>
