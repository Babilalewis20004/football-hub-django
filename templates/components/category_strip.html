{% if categories %}
<section class="mb-5">
    <div class="section-head">
        <h2>Browse by category</h2>
    </div>

    <div class="cat-strip">
        {% for category in categories %}
            {% if category.post_count %}
                <a href="{% url 'category_posts' slug=category.slug %}" class="cat-pill">
                    <h3>{{ category.name }}</h3>
                    <span>{{ category.post_count }} post{{ category.post_count|pluralize }}</span>
                </a>
            {% endif %}
        {% endfor %}
    </div>
</section>
{% endif %}
