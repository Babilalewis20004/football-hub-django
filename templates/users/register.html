{% extends 'base.html' %}
{% load static %}

{% block content %}

<div class="register-wrapper">
    <div class="glass-card">

        <h2 class="neon-title">Create Your Account</h2>

        {% if messages %}
            {% for message in messages %}
                <div class="alert success-glow">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="post" id="registerForm">
            {% csrf_token %}
            {{ form.as_p }}

            <!-- Password Strength Meter -->
            <div class="strength-meter">
                <div id="strength-bar"></div>
            </div>

            <button class="neon-btn" type="submit">
                Register
            </button>

            <div class="social-login">
                <p>Or continue with</p>
                <button class="social-btn google">Google</button>
                <button class="social-btn facebook">Facebook</button>
                <button class="social-btn twitter">Twitter</button>
            </div>

        </form>

    </div>
</div>

<script src="{% static 'js/password-strength.js' %}"></script>


{% endblock %}
