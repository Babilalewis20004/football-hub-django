# Reverse proxy for single-host production deployment.
#
# Responsibilities:
#   1. Serve /media/ directly from the shared media_data volume — this is
#      the piece nothing in the Django codebase handles once DEBUG=False
#      (config/urls.py only wires up Django's own media route in debug
#      mode). See docs/architecture/deployment-architecture.md.
#   2. Proxy everything else (HTTP pages and /ws/ WebSocket upgrades) to
#      Daphne on the internal `backend` network at web:8000.
#
# Static files are deliberately NOT served here: WhiteNoise (already
# wired into MIDDLEWARE) continues to serve STATIC_ROOT from inside the
# Daphne process, so static requests are proxied through like any other
# HTTP request rather than duplicated at the Nginx layer.
#
# TLS is not configured here. This file terminates plain HTTP on :80 for
# a single-host deployment; put a TLS-terminating load balancer / another
# proxy in front, or add a `listen 443 ssl` server block with real
# certificates, before exposing this to the public Internet. If TLS is
# terminated in front of this container, also set SECURE_PROXY_SSL_HEADER
# in config/settings.py so Django recognises the forwarded scheme before
# enabling SECURE_SSL_REDIRECT — see docs/docker.md.

upstream django_app {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    location /media/ {
        alias /app/media/;
        access_log off;
    }

    location /ws/ {
        proxy_pass http://django_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location / {
        proxy_pass http://django_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
