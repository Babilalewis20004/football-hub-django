# Production overrides. Combine explicitly with the base file:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# (docker-compose.override.yml is NOT auto-merged when -f is used
# explicitly, so this combination stays dev-free.)
#
# Characteristics: immutable image (no source bind mount), Daphne serves
# ASGI directly (image ENTRYPOINT default — see docker/entrypoint.sh),
# collectstatic runs on start, media/static persisted in named volumes,
# Nginx is the only container with a published host port.

services:
  web:
    restart: unless-stopped
    volumes:
      - media_data:/app/media
      # No static volume: WhiteNoise serves STATIC_ROOT from inside the
      # web container itself, and `collectstatic` (see docker/entrypoint.sh)
      # regenerates it from the static/ source tree on every container
      # start — so staticfiles/ doesn't need to persist across restarts.
    # No ports published here: only Nginx is reachable from the host.
    # Daphne stays internal-only, on the `backend` network.

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - media_data:/app/media:ro
    ports:
      - "80:80"
    networks:
      - backend

  postgres:
    restart: unless-stopped

  redis:
    restart: unless-stopped

volumes:
  media_data:
